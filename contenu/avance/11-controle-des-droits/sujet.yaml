    duree: 20
    fichier: demonstration-2.md
    programme: [divers.expression-language, securite.autorisation, securite.strategies]
  - id: s11-demo-3
    type: demonstration
    titre: "Démonstration, partie 3 : un contrôle des droits écrit avec VoterInterface, et la stratégie « unanime »"
    duree: 25
    fichier: demonstration-3.md
    programme: [securite.droits, securite.strategies]
  - id: s11-exercice
    type: exercice
    titre: "Exercice : les droits sur les tickets et le compte désactivé"
    duree: 60
    fichier: exercice.md
    tests: tests/Exercices/ControleDesDroits
    programme: [securite.droits, securite.strategies, securite.autorisation, twig.filtres-fonctions]
