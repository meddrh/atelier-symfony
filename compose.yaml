services:
  app:
    build:
      context: docker
      args:
        # Linux : exporte APP_UID=$(id -u) et APP_GID=$(id -g) avant « docker compose build » si ton compte n'est pas 1000.
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    volumes:
      - .:/app
    working_dir: /app
    ports:
      - "127.0.0.1:8000:8000"
    # Le routeur envoie /formation… et /atelier/… à la plateforme (noyau indépendant), le reste à l'application du junior.
    command: php -S 0.0.0.0:8000 -t public public/routeur.php
